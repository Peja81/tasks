name: Debug APK

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build generic debug APK
        run: ./gradlew :app:assembleGenericDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-generic-debug
          path: app/build/outputs/apk/generic/debug/app-generic-debug.apk
          if-no-files-found: error
